<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta content="origin" name="no-referrer" />
    <title>CozySSH</title>
    <style id="cozy_css"></style>
    <style id="cozy_local_css"></style>
    <script>
      (function () {
        const startupParams = new URLSearchParams(location.search);
        if (startupParams.get("_scan") === "1") {
          document.write('<script crossorigin="anonymous" src="//unpkg.com/react-scan/dist/auto.global.js"><\/script>');
        }
        if (startupParams.get("nocss") === "1") {
          return;
        }
        const keys = ["cozy_vars", "cozy_localvars"];
        for (const key of keys) {
          const data = localStorage.getItem(key);
          if (!data) {
            continue;
          }
          const prefix = key === "cozy_localvars" ? "local_" : "";
          try {
            const vars = JSON.parse(data);
            let variable = vars?.[prefix + "class"];
            if (variable) {
              let className = document.documentElement.getAttribute("class") || "";
              if (className !== "") {
                className += " ";
              }
              className += variable;
              document.documentElement.setAttribute("class", className);
            }
            variable = vars?.[prefix + "css"] || "";
            document.getElementById("cozy_" + prefix + "css").textContent = variable;
          } catch {}
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Please enable JavaScript to use CozySSH</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
