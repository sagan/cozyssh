<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CozySSH</title>
    <script>
      (function () {
        const startupParams = new URLSearchParams(location.search);
        if (startupParams.get("nocss") === "1") {
          return;
        }
        const keys = ["cozy_vars", "cozy_localvars"];
        for (const key of keys) {
          const data = localStorage.getItem(key);
          if (!data) {
            continue;
          }
          try {
            const vars = JSON.parse(data);
            if (vars?.class) {
              let className = document.documentElement.getAttribute("class") || "";
              if (className != "") {
                className += " ";
              }
              className += vars.class;
              document.documentElement.setAttribute("class", className);
            }
            if (vars?.css) {
              const styleSheet = document.createElement("style");
              styleSheet.id = key + "_css";
              styleSheet.textContent = vars.css;
              document.head.appendChild(styleSheet);
            }
          } catch {}
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Please enable JavaScript to use CozySSH</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
