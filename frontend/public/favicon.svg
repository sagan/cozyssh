<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#150a26;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb86c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff79c6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- House Shape (Double as a prompt) -->
  <path d="M140 380V230L256 120L372 230V380H290V270H222V380H140Z" fill="url(#iconGrad)"/>
  
  <!-- Chimney -->
  <path d="M305 180V145H335V205" fill="url(#iconGrad)"/>
  
  <!-- Terminal Prompt Notch (The '>' part integrated into the left roof) -->
  <path d="M130 250L190 200L130 150" fill="none" stroke="url(#iconGrad)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" transform="translate(10, 10)"/>

  <!-- Cursor -->
  <rect x="390" y="355" width="50" height="25" rx="5" fill="#ffb86c"/>
</svg>