name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      # ----------------------------------------------------
      # Pass 1: Build & Publish English Version (Base)
      # ----------------------------------------------------
      - name: Build Frontend (English)
        run: npm --prefix frontend run build

      - name: Run GoReleaser (English)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          I18N_SUFFIX: "" # Leaves filename as base template
          DISABLE_CHANGELOG: "false" # Generates the initial changelog

      # ----------------------------------------------------
      # Pass 2: Build & Publish Chinese Version (zh-CN)
      # ----------------------------------------------------
      - name: Build Frontend (zh-CN)
        run: npm --prefix frontend run build
        env:
          VITE_APP_LANG: zh-CN

      - name: Run GoReleaser (zh-CN)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          # --skip=changelog stops GoReleaser from overwriting original release notes
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          I18N_SUFFIX: "_zh-CN" # Appends _zh-CN to the zip filenames
          DISABLE_CHANGELOG: "true" # Safely skips changelog generation entirely
